name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The Windows-generated lockfile omits Linux rollup optional-dependency
      # nodes (npm/cli#4828). Remove it so npm resolves the correct platform
      # binary fresh on the Linux runner.
      - run: rm -f package-lock.json
      - run: npm install
      # prebuild runs scripts/verify-data.mjs first (33 offline checks against
      # the committed catalog), so a bad fonts.json fails here, not in the browser.
      # VITE_BUILD stamps this deploy's number into the page (shown beside the
      # app name as v<version>.<build>); it increments per workflow run with no
      # file to bump. Local builds have no number and show the bare version.
      - run: npm run build
        env:
          VITE_BUILD: ${{ github.run_number }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
